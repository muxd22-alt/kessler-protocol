<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Kessler Protocol — every enemy piloted live by a local System One decision model. A real-time edge-AI game showcase." />
    <meta name="theme-color" content="#060612" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preload" as="script" href="./src/main.ts" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 26,28 16,22 6,28' fill='%237eb8ff'/%3E%3C/svg%3E" />
    <title>Kessler Protocol — Edge-AI Space Shooter</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #060612; overflow: hidden;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game-container { width: 100%; height: 100%; }
      #game-container canvas { display: block; margin: 0 auto; }
      #boot-fallback {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #7eb8ff; background: #060612; z-index: 0;
        font-size: 14px; letter-spacing: 3px;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="boot-fallback">INITIALIZING&nbsp;KESSLER&nbsp;PROTOCOL…</div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Remove the static fallback text once Phaser boots.
      new MutationObserver(function (m, o) {
        if (document.querySelector('#game-container canvas')) {
          var f = document.getElementById('boot-fallback');
          if (f) f.remove();
          o.disconnect();
        }
      }).observe(document.getElementById('game-container'), { childList: true });
    </script>
  </body>
</html>
