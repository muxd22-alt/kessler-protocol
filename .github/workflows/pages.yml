# Builds the Phaser client and publishes it to GitHub Pages.
# The hosted demo is fully static: with no localhost backend it runs on the
# built-in local heuristic twin (see src/ai/localBrain.ts), so no server is
# needed for the public link. For live model inference, run the backend
# locally:  cd server && python main.py  (then open localhost:3000).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      # The job's working-directory is client/, so repo-level paths are relative.
      # This step is the whole point: the browser generator and the headless
      # trainer must build byte-identical arenas from the same seed.
      - name: Arena determinism — symmetry audit + TS/Python golden vectors
        run: |
          python3 ../server/gen_golden.py --check
          npx esbuild ../test/golden_arenas.test.ts --bundle --platform=node --format=cjs --outfile=../test/.golden.tmp.cjs --log-level=error
          cd ../test && node .golden.tmp.cjs

      # Re-measures the generalisation claim on every deploy: train seeds vs
      # reserved held-out seeds. Fails loudly if the champion regresses.
      - name: Generalisation — held-out seeds
        run: python3 ../server/heldout_eval.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
